name: Dependency repair candidates
on:
  pull_request:
    paths:
      - '.github/workflows/dependency-repair-candidates.yml'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Propose compatible backend lockfile repairs (no force, no scripts)
        run: npm audit fix --prefix backend --package-lock-only --ignore-scripts --no-fund || true
      - name: Propose compatible frontend lockfile repairs (no force, no scripts)
        run: npm audit fix --prefix frontend --package-lock-only --ignore-scripts --no-fund || true
      - name: Report candidate lockfile changes
        run: git diff --stat -- backend/package-lock.json frontend/package-lock.json
      - name: Store candidates for review (never push)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-lockfile-candidates
          path: |
            backend/package-lock.json
            frontend/package-lock.json
          retention-days: 7
