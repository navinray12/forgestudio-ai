name: Frontend full lint qualification
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-full-lint.yml'
  push:
    branches: [fix/tailwind-theme-vars-20261014]
    paths:
      - '.github/workflows/frontend-full-lint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-frontend-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix frontend
      - name: Lint entire frontend codebase
        run: npm run lint --prefix frontend
