name: Tailwind 4 security migration canary
on:
  pull_request:
    branches: [fix/main-ai-security-20261014]
    paths:
      - 'backend/package.json'
      - 'backend/src/modules/ai/design/converter.ts'
      - '.github/workflows/backend-audit-override-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/backend-audit-overrides-20261014' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      DATABASE_URL: postgresql://postgres:disposable_fixture_only@127.0.0.1:5432/forge_disposable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Resolve Tailwind 4 lockfile with its official PostCSS plugin
        run: npm install --prefix backend --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install candidate without changing application source
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Compile full backend
        run: npm run build --prefix backend
      - name: Exercise AI design conversion and security tests
        working-directory: backend
        run: node --import tsx --test src/tests/ai-design.test.ts
      - name: Exercise website-to-code regressions
        run: npm run test:website-to-code --prefix backend
      - name: Require zero high or critical npm advisories
        run: npm audit --prefix backend --audit-level high --json > "$RUNNER_TEMP/backend-audit.json"
      - name: Commit only tested lockfile update
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git add -- backend/package.json backend/package-lock.json backend/src/modules/ai/design/converter.ts
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): qualify Tailwind 4 runtime migration'
          git push origin "HEAD:refs/heads/$PR_BRANCH"
