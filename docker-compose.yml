services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_local_only
      POSTGRES_DB: forge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]

  api:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 5000
      FRONTEND_URL: http://127.0.0.1:5173
      DATABASE_URL: postgresql://forge:forge_local_only@postgres:5432/forge
      FORGE_AUTH_MODE: local
      FORGE_LOCAL_OTP_FILE: /tmp/forge-local-otp.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      AI_SITE_PROVIDER: ${AI_SITE_PROVIDER:-openai}
      AI_MODEL_PLANNER: ${AI_MODEL_PLANNER:-}
      AI_PROMPT_ENCRYPTION_KEY: ${AI_PROMPT_ENCRYPTION_KEY:-}
      AI_PROMPT_RETENTION_HOURS: ${AI_PROMPT_RETENTION_HOURS:-24}
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:5000:5000"]

  worker:
    build: ./backend
    command: ["node", "dist/workers/main.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://forge:forge_local_only@postgres:5432/forge
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:5000
    depends_on: [api]
    ports: ["127.0.0.1:5173:80"]

  migrate:
    build:
      context: ./backend
      target: build
    command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://forge:forge_local_only@postgres:5432/forge
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
